<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="theme-color" id="tc" content="#171b21"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Request Material - PT. SHM</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="common.css"/>
<style>
.pg-hdr{display:flex;align-items:center;gap:12px;padding:16px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.pg-hdr h1{font-size:16px;font-weight:700;margin:0}
.pg-body{padding:16px;max-width:640px;margin:0 auto}
.kapal-row{display:flex;gap:6px;align-items:flex-end}
.kapal-row select{flex:1}
.kapal-btn{flex-shrink:0;width:38px;height:38px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-size:16px;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="pg-hdr">
  <a href="input.html" style="font-size:22px;text-decoration:none;color:var(--fg)">&#8249;</a>
  <h1>&#128230; Request Material</h1>
</div>
<div class="pg-body">
  <div class="card">
    <div class="card-hdr"><div class="cico cg">&#128230;</div><div><div class="card-ttl">Request Material</div><div class="card-sub">Bisa tambah lebih dari 1 material sekaligus</div></div></div>
    <div class="card-body">
      <div class="fs">
        <div class="field"><label class="flbl">Tanggal</label><input type="date" id="m_tgl"/></div>
        <div class="field">
          <label class="flbl">Kapal / Project Utama</label>
          <div class="kapal-row">
            <select id="m_kapal"><option value="">— Pilih Kapal —</option></select>
            <button type="button" class="kapal-btn" onclick="kapalPromptAdd()" title="Tambah kapal">&#10133;</button>
            <button type="button" class="kapal-btn" onclick="kapalPromptDelete()" title="Hapus kapal">&#128465;</button>
          </div>
        </div>
      </div>

      <div class="sec-lbl" style="margin-top:16px">Daftar Material</div>
      <div id="mrows"></div>
      <datalist id="mat_global_list"></datalist>
      <button type="button" class="btn btn-o btn-fw" onclick="matAddRow()">&#10133; Tambah Material</button>

      <div class="brow" style="margin-top:14px">
        <button class="btn btn-o" onclick="prevMaterial()">Preview WA</button>
        <button class="btn btn-p" onclick="saveMaterial()">Simpan Semua</button>
      </div>
    </div>
  </div>
  <div class="card" id="m_prev_card" style="display:none">
    <div class="card-hdr"><div class="cico ct">&#128172;</div><div><div class="card-ttl">Preview WhatsApp</div></div></div>
    <div class="card-body"><div class="pre-box" id="m_prev"></div>
      <div class="brow"><button class="btn btn-g btn-sm" onclick="copyEl('m_prev')">Salin Teks</button></div>
    </div>
  </div>
</div>
<div id="toast"></div>
<script src="common.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  try{ kapalRenderOptions(); }catch(e){ console.error('Gagal load kapal:', e); }
  try{ matRenderGlobalList(); }catch(e){ console.error('Gagal load daftar material:', e); }
  try{ matAddRow(); }catch(e){ console.error('Gagal buat baris material:', e); }
});
</script>
</body>
</html>
